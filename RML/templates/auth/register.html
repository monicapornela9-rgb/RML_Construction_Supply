{% extends "base.html" %}
{% block title %}Register - RML Construction Supply{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-4">
        <h3 class="fw-bold mb-1">Create Customer Account</h3>
        <p class="text-muted small mb-4">Register to order construction materials and schedule deliveries.</p>
        <form method="POST" action="{{ url_for('main.register') }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Full Name / Company</label>
            <input type="text" name="name" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Phone Number</label>
            <input type="text" name="phone" class="form-control" required placeholder="+63 912 345 6789">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Default Delivery Address</label>
            <input type="text" name="address" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-rml w-100 py-2 fw-semibold">Create Account</button>
        </form>
        <div class="text-center mt-3 small">
          Already have an account? <a href="{{ url_for('main.login', role='customer') }}" class="text-rml fw-semibold">Sign in</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
