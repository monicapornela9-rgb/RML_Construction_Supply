{% extends "base.html" %}
{% block title %}Customer Registration - RML Construction Supply{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm p-4 p-md-5">
        <div class="mb-4 text-center">
          <span class="rml-logo-box mb-2">R</span>
          <h3 class="fw-bold">Create Customer Account</h3>
          <p class="text-muted small">Sign up to order construction supplies, schedule deliveries, and track live truck GPS.</p>
        </div>

        <form method="POST" action="{{ url_for('main.register') }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Company / Full Name *</label>
            <input type="text" name="name" class="form-control" required placeholder="e.g. Santos Residence or Engr. Juan Perez">
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Email Address *</label>
              <input type="email" name="email" class="form-control" required placeholder="name@example.com">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Contact Mobile Number *</label>
              <input type="tel" name="phone" class="form-control" required placeholder="0917 123 4567">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Default Site / Delivery Address *</label>
            <input type="text" name="address" class="form-control" required placeholder="Lot, Street, Brgy, Lipa City, Batangas">
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold">Password *</label>
            <input type="password" name="password" class="form-control" required placeholder="Create a secure password">
          </div>

          <button type="submit" class="btn btn-rml w-100 py-2 fw-semibold">Complete Registration</button>
        </form>

        <div class="text-center mt-3 small text-muted">
          Already have an account? <a href="{{ url_for('main.login', role='customer') }}" class="text-rml fw-semibold text-decoration-none">Sign in here</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
