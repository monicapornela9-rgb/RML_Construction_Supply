{% extends "base.html" %}
{% block title %}Reset Password - RML Construction Supply{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="customer-portal-card p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow-sm" style="width: 60px; height: 60px; background: #F8FAFC; border: 1px solid #E2E8F0;">
            <i class="bi bi-key-fill fs-3 text-navy"></i>
          </div>
          <h2 class="customer-portal-title mb-1">Reset Password</h2>
          <p class="customer-portal-subtitle">Enter your registered customer account email to receive a secure password reset link.</p>
        </div>

        <form method="POST" action="{{ url_for('main.forgot_password') }}">
          <div class="mb-4">
            <label class="form-label small fw-semibold text-dark">Registered Email Address *</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control border-start-0 ps-0" required
                     placeholder="customer@example.com" autofocus>
            </div>
          </div>

          <button type="submit" class="btn btn-rml w-100 py-2 fs-6 fw-semibold shadow-sm">
            <i class="bi bi-send me-1"></i> Send Password Reset Link
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top small text-muted">
          Remember your password?
          <a href="{{ url_for('main.login') }}" class="text-rml fw-semibold text-decoration-none ms-1">
            Back to Sign In &rarr;
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
