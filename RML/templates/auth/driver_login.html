{% extends "base.html" %}
{% block title %}Driver Login - RML Construction Supply{% endblock %}

{% block content %}
<div class="portal-login-page">
  <div class="compact-portal-login">
    <div class="mb-4">
      <span class="badge text-bg-light border text-muted smaller mb-2">Driver Portal</span>
      <h2 class="fw-bold text-navy mb-0" style="font-size: 1.5rem;">Driver sign in</h2>
    </div>

    <form method="POST" action="{{ url_for('main.driver_login') }}" id="driverLoginForm">
      <div class="mb-3">
        <label class="form-label" for="driverIdentifier">Staff ID or email</label>
        <input type="text" name="identifier" id="driverIdentifier" class="form-control" required
               placeholder="Enter your staff ID or email" value="{{ identifier_value or '' }}" autocomplete="username" autofocus>
      </div>

      <div class="mb-3">
        <label class="form-label" for="driverPassword">Password</label>
        <div class="input-group">
          <input type="password" name="password" id="driverPassword" class="form-control" required
                 placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePasswordVisibility('driverPassword', this)"
                  aria-label="Show password" aria-pressed="false">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-rml w-100">Sign in</button>
    </form>
  </div>
</div>

<script>
function togglePasswordVisibility(fieldId, btn) {
  const field = document.getElementById(fieldId);
  const icon = btn.querySelector('i');
  const isVisible = field.type === 'password';
  field.type = isVisible ? 'text' : 'password';
  icon.classList.toggle('bi-eye', !isVisible);
  icon.classList.toggle('bi-eye-slash', isVisible);
  btn.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
  btn.setAttribute('aria-pressed', String(isVisible));
}
</script>
{% endblock %}
